<!DOCTYPE html>
<html>
<head>
    <title>Список чатов</title>
</head>
<body>
    <h1>Чаты</h1>

    <a href="{% url 'create_chat' %}">Создать новый чат</a>

    <ul>
        {% for chat in chats %}
            <li>
                <a href="{% url 'chat_detail' chat.id %}">
                    {{ chat.title }} ({{ chat.messages.count }} сообщений)
                </a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
